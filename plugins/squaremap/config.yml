config-version: 3
settings:
    web-directory:
        path: web
        auto-update: true
    image-quality:
        compress-images:
            enabled: false
            value: 0.0
    language-file: lang-en.yml
    debug-mode: false
    update-checker: true
    web-address: http://localhost:8080
    internal-webserver:
        enabled: true
        bind: 127.0.0.1
        port: 8080
        flush-json-immediately: false
    commands:
        main-command-label: squaremap
        main-command-aliases:
        - map
    render-progress-logging:
        enabled: true
        interval-seconds: 1
    ui:
        coordinates:
            enabled: true
        link:
            enabled: true
        sidebar:
            pinned: unpinned
world-settings:
    default:
        map:
            lava:
                checkerboard: true
            zoom:
                maximum: 3
                default: 3
                extra: 2
            render:
                full:
                    workers: default
                    max-chunk-requests: default
                    max-active-chunks: default
                    max-active-regions: 2
                    max-column-chunks: 16
                    idle-chunk-cache-size: default
                radius:
                    workers: default
                    max-chunk-requests: default
                    max-active-chunks: default
                    max-active-regions: 2
                    max-column-chunks: 16
                    idle-chunk-cache-size: default
                background:
                    workers: default
                    max-chunk-requests: default
                    max-active-chunks: default
                    max-active-regions: 2
                    max-column-chunks: 16
                    idle-chunk-cache-size: default
                    enabled: true
                    interval-seconds: 15
                    max-chunks-per-interval: 2048
            image-saving:
                workers: 2
                max-pending-images: 100
            markers:
                update-interval-seconds: 5
                spawn-icon:
                    enabled: true
                    show-controls: true
                    default-hidden: false
                    layer-priority: 0
                    z-index: 0
                world-border:
                    enabled: true
                    show-controls: true
                    default-hidden: false
                    layer-priority: 1
                    z-index: 1
            visibility-limits:
            -   type: world-border
                enabled: 'false'
            glass:
                clear: true
            enabled: true
            display-name: '{world}'
            order: 0
            icon: ''
            iterate-up: false
            max-height: -1
            water:
                clear-depth: true
                checkerboard: false
            biomes:
                enabled: true
                blend-biomes: 3
        player-tracker:
            enabled: false
            update-interval-seconds: 1
            show-controls: true
            default-hidden: false
            layer-priority: 2
            z-index: 2
            nameplate:
                enabled: true
                show-head: true
                heads-url: https://mc-heads.net/avatar/{uuid}/16
                show-armor: true
                show-health: true
            hide:
                invisible: true
                spectators: true
                map-invisibility-equipment: true
            use-display-names: false
