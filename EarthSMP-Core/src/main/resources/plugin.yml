name: EarthSMPCore
version: '0.3.0'
main: io.github.wedelsigma.earthsmp.core.EarthSmpCorePlugin
api-version: '26.3'
authors: [Wedel-Sigma]
description: Core gameplay plugin for EarthSMP (nation creation and SQLite persistence)
website: https://github.com/Wedel-Sigma/EarthSMP
commands:
  earthsmp:
    description: EarthSMP Core test commands
    usage: /earthsmp status
    aliases: [esmp]
    permission: earthsmp.admin
permissions:
  earthsmp.admin:
    description: Access to administrative EarthSMP Core test commands
    default: op
