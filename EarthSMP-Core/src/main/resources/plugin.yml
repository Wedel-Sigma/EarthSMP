name: EarthSMPCore
version: '1.8.0'
main: io.github.wedelsigma.earthsmp.core.EarthSmpCorePlugin
api-version: '26.3'
authors: [Wedel-Sigma]
softdepend: [squaremap]
description: "EarthSMP: nations, GUI, territories, protection cores, diplomacy and siege pickaxes and block provenance."
website: https://github.com/Wedel-Sigma/EarthSMP
commands:
  earthsmp:
    description: EarthSMP central GUI and admin commands
    usage: /earthsmp menu
    aliases: [esmp]
    permission: earthsmp.use
permissions:
  earthsmp.use:
    description: Access to EarthSMP player commands
    default: true
  earthsmp.admin:
    description: Access to EarthSMP administrative test commands
    default: op
