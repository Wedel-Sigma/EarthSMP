# Public branding only. Internal plugin IDs, commands and filenames remain EarthSMP.
# Existing config files without this key also use "Kabina Narodów 2.0".
server:
  display-name: "Kabina Narodów 2.0"

# Minecraft world folder from server.properties (level-name=Earth)
world-name: Earth
# Identifier of Overworld on squaremap (Earth world in Paper is minecraft:overworld)
squaremap-world-id: minecraft:overworld

# Authenticated map portal (SEPARATE from the public squaremap website).
# Local test: open http://127.0.0.1:8766 on the server computer.
# For players over Tailscale: bind-address: 0.0.0.0 and public-origin: http://YOUR_TAILSCALE_IP:8766
# Do NOT expose this HTTP port directly to the public Internet. Use an HTTPS reverse proxy.
map-portal:
  enabled: true
  bind-address: "127.0.0.1"
  port: 8766
  public-origin: "http://127.0.0.1:8766"
  squaremap-internal-url: "http://127.0.0.1:8080"
  # Optional UUID allowlist for web-admin approval, including when admins are offline.
  # Server operators (OP) have access automatically. Never use player nicknames here.
  admin-uuids: []

# Minecraft sidebar; players can disable individually with /esmp sidebar.
sidebar:
  disabled-players: []

# Progresja wymiarow: 10 oznacza dostep od dnia serwera 10 o 06:00 PL.
# W starych zapisach wystepuje tez "po dziesieciu pelnych dniach" (czyli 11).
# Ustalic ostateczny prog przed startem edycji; mozna zmienic na 11 bez przebudowy.
progression:
  nether-unlock-day: 10
